<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LABORA Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--navy:#002c49;--navy2:#0a3d5f;--navy3:#154d73;--deep:#001f34;--slate:#D6DEE4;--s1:#e8edf1;--s2:#f3f6f8;--s3:#b9c6cf;--soft:#3d5a70;--ok:#1f7a4d;--okbg:#dff1e7;--warn:#9a5b00;--warnbg:#fbeccf;--bad:#a63030;--disp:'Manrope','Segoe UI',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;--e:cubic-bezier(.4,0,.2,1);color-scheme:light}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--s1);color:var(--navy);font:400 15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}button,input,select{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:3px solid var(--navy3);outline-offset:2px}
svg{display:block}.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#root{display:flex;flex-direction:column;min-height:100vh}#root>main{flex:1}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.hdr{background:var(--navy);color:#fff;width:100%}.hw{display:flex;align-items:center;gap:14px;min-height:68px;padding:8px 18px}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;color:#fff;padding:0;text-align:left}
.mark{width:42px;height:42px;border-radius:11px;background:var(--slate);color:var(--navy);display:grid;place-items:center;flex:none}
.brand b{display:block;font:800 18px/1 var(--disp);letter-spacing:.14em}.brand small{display:block;font-size:12px;color:var(--s3);margin-top:4px}
.sp{flex:1}.who{display:flex;align-items:center;gap:10px;padding:4px 14px 4px 4px;border-radius:99px;background:#ffffff14;border:1px solid #ffffff22;font-size:13.5px;font-weight:600}
.av{width:34px;height:34px;border-radius:50%;background:var(--slate);color:var(--navy);display:grid;place-items:center;font:700 12px var(--disp);flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 20px;border-radius:99px;border:1.5px solid var(--navy);background:var(--navy);color:#fff;font-weight:600;font-size:14.5px;box-shadow:0 6px 14px -8px #002c49;transition:background .2s var(--e),color .2s var(--e),transform .2s var(--e),box-shadow .2s var(--e)}
.btn:hover{background:var(--navy3);transform:translateY(-1px);box-shadow:0 10px 18px -8px #002c49}.btn:disabled{opacity:.45;pointer-events:none}
.btn.ghost{background:transparent;color:var(--navy);box-shadow:none}.btn.ghost:hover{background:var(--slate);transform:none}.btn.sm{height:36px;padding:0 14px;font-size:13.5px}.btn.danger{background:var(--bad);border-color:var(--bad)}
.hdr .btn.ghost{color:#fff;border-color:#ffffff44}.hdr .btn.ghost:hover{background:var(--slate);color:var(--navy)}
.canvas{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--s2),var(--s1) 60%,var(--slate))}
.canvas::before{content:"";position:absolute;inset:0;background-image:linear-gradient(#002c490d 1px,transparent 1px),linear-gradient(90deg,#002c490d 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 75%)}
.in{position:relative;padding:48px 20px 56px}.in.d{padding-top:24px}
.eyebrow{font-size:13px;font-weight:600;color:var(--navy3)}.welcome{text-align:center;max-width:640px;margin:0 auto 36px}.welcome h2{font:800 clamp(30px,4.4vw,44px)/1.1 var(--disp);letter-spacing:-.025em;margin:12px 0}.welcome p{color:var(--soft);font-size:17px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;max-width:820px;margin:0 auto}
.pc{position:relative;display:flex;flex-direction:column;min-height:320px;padding:26px;border-radius:22px;overflow:hidden;isolation:isolate;color:#fff;text-align:left;border:1px solid #ffffff1f;background:linear-gradient(155deg,var(--navy2),var(--navy) 55%,var(--deep));box-shadow:0 18px 40px -18px #002c4999;transition:transform .3s var(--e),box-shadow .3s var(--e)}
.pc::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 100% 0,#D6DEE430,transparent 55%),repeating-linear-gradient(135deg,#ffffff08 0 1px,transparent 1px 22px)}
.geo{position:absolute;right:-60px;top:-60px;width:240px;height:240px;z-index:-1;transition:transform .6s var(--e)}.geo *{fill:none;stroke:#D6DEE4;stroke-opacity:.2}
.chip{align-self:flex-start;height:28px;display:inline-flex;align-items:center;padding:0 12px;border-radius:99px;background:#D6DEE41f;border:1px solid #D6DEE433;font-size:12.5px;font-weight:600;color:var(--slate)}
.ico{width:58px;height:58px;border-radius:16px;background:var(--slate);color:var(--navy);display:grid;place-items:center;margin-top:20px;box-shadow:0 0 0 8px #D6DEE41a;transition:transform .3s var(--e)}.ico svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.pc h3{font:800 42px/1 var(--disp);letter-spacing:-.03em;margin-top:20px}.pc .full{font:600 15px/1.35 var(--disp);color:var(--slate);margin-top:8px}.pc .d{color:#c3d0da;font-size:14px;margin-top:8px;max-width:34ch}
.cta{margin-top:auto;padding-top:20px;display:flex;align-items:center;justify-content:space-between;font:700 15px var(--disp)}
.arrow{width:42px;height:42px;border-radius:50%;border:1.5px solid #D6DEE466;display:grid;place-items:center;color:var(--slate);transition:.3s var(--e)}
.pc:hover{transform:translateY(-6px);box-shadow:0 34px 56px -20px #002c49cc}.pc:hover .ico{transform:rotate(-6deg) scale(1.05)}.pc:hover .geo{transform:rotate(14deg) scale(1.08)}.pc:hover .arrow{transform:translateX(6px);background:var(--slate);color:var(--navy)}
.login{max-width:430px;margin:40px auto 0;background:#fff;border:1px solid var(--s3);border-radius:22px;padding:34px;box-shadow:0 24px 50px -28px #002c4999}.login h2{font:800 28px var(--disp)}.login>p{color:var(--soft);margin:6px 0 22px}
.f{display:block;margin-bottom:16px}.f span{display:block;font-weight:600;font-size:13.5px;margin-bottom:6px}
.f input,.f select,.bar select{width:100%;height:46px;padding:0 14px;border-radius:12px;border:1.5px solid var(--s3);background:#fff}.f input:focus,.f select:focus{border-color:var(--navy);outline:0;box-shadow:0 0 0 3px #002c4920}.err{color:var(--bad);font-size:13px;margin:-6px 0 12px}
.ctx{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}.cl,.cr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pchip{height:32px;padding:0 14px;border-radius:99px;background:var(--navy);color:#fff;font:800 14px/32px var(--disp);letter-spacing:.04em}.pf{color:var(--soft);font-weight:500}
.cr select{height:38px;border-radius:12px;border:1.5px solid var(--s3);padding:0 12px;background:#fff;font-weight:500;width:auto}
.tabs{display:flex;gap:6px;margin-bottom:22px;padding:6px;background:#fff;border:1px solid var(--s3);border-radius:16px;overflow-x:auto}
.tab{flex:1;min-width:max-content;height:44px;padding:0 16px;border:0;border-radius:11px;background:transparent;font-weight:600;font-size:14.5px;color:var(--soft);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.2s var(--e)}
.tab:hover{background:var(--s1);color:var(--navy)}.tab[aria-selected=true]{background:var(--navy);color:#fff}
.badge{display:inline-flex;align-items:center;height:26px;padding:0 12px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--slate);color:var(--navy);white-space:nowrap}.badge.ok{background:var(--okbg);color:var(--ok)}.badge.warn{background:var(--warnbg);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat,.panel,.bc,.fc{background:#fff;border:1px solid var(--s3);border-radius:18px;padding:22px;transition:transform .25s var(--e),box-shadow .25s var(--e),border-color .25s var(--e);box-shadow:0 2px 6px -3px #002c4944}
.stat:hover,.panel:hover,.bc:hover,.fc:hover{transform:translateY(-3px);border-color:var(--navy);box-shadow:0 16px 28px -16px #002c49aa}
.stat .l{color:var(--soft);font-size:14px;font-weight:500}.stat .n{font:800 36px/1.1 var(--disp);margin-top:6px}.stat .s{font-size:13px;color:var(--soft);margin-top:4px}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:20px}.panel+.panel{margin-top:20px}.two .panel+.panel{margin-top:0}.panel h3{font:700 19px var(--disp)}.sub{color:var(--soft);font-size:14px;margin-bottom:16px}
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--s1)}.row:first-of-type{border-top:0}.row .g{flex:1;min-width:0}.row b{display:block;font-weight:600}.row small{color:var(--soft);font-size:13.5px}
.ck{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--s1);color:var(--soft);flex:none}.ck.on{background:var(--navy);color:#fff}.ck svg{width:15px;height:15px}
.bg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}.bc{text-align:left;border-top:4px solid var(--navy);cursor:pointer;width:100%}.bc.sel{box-shadow:0 0 0 3px #002c4922}
.bc h3{font:800 26px var(--disp);margin:12px 0 2px}.bc .yr{color:var(--soft);font-size:14px;margin-bottom:16px}.bm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:14px;border-top:1px solid var(--s1)}.bm b{display:block;font:800 20px var(--disp)}.bm small{color:var(--soft);font-size:12.5px}
.bc.add{display:grid;place-items:center;text-align:center;border:2px dashed var(--s3);border-top:2px dashed var(--s3);background:var(--s2);color:var(--soft);min-height:200px;font-weight:600}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.fc{display:flex;flex-direction:column;gap:10px;padding:18px}.fc .t{display:flex;gap:12px;align-items:center}.fc b{display:block}.fc small{color:var(--soft)}.fc .bs{display:flex;gap:6px;flex-wrap:wrap}.fc .ac{display:flex;gap:8px;margin-top:auto}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:620px}th{text-align:left;font-size:13.5px;font-weight:600;color:var(--soft);padding:10px 12px;border-bottom:1.5px solid var(--s1)}td{padding:14px 12px;border-bottom:1px solid var(--s1);font-size:15px}tr:last-child td{border-bottom:0}.acts{display:flex;gap:8px;justify-content:flex-end}
.empty{text-align:center;padding:32px 16px;color:var(--soft)}.empty b{display:block;color:var(--navy);font:700 18px var(--disp);margin-bottom:6px}
.file{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:20px;border-radius:16px;background:var(--s2);border:1px solid var(--s1)}.file .mark{background:var(--navy);color:#fff;width:52px;height:52px}
.drop{border:2px dashed var(--s3);border-radius:16px;padding:32px 20px;text-align:center;background:var(--s2);transition:.2s var(--e)}.drop.hov{border-color:var(--navy);background:var(--slate)}.drop b{display:block;font:700 17px var(--disp);margin:10px 0 4px}.drop p{color:var(--soft);margin-bottom:14px;font-size:14px}
.ov{position:fixed;inset:0;background:#001f3499;display:grid;place-items:center;padding:20px;z-index:20;overflow:auto}.md{background:#fff;border-radius:20px;width:100%;max-width:460px;padding:28px;box-shadow:0 30px 70px -20px #001f34;margin:auto}.md.w{max-width:600px}
.md h3{font:800 22px var(--disp)}.md>p{color:var(--soft);margin:6px 0 18px}.md .ft{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}.md table{min-width:0}.pv{max-height:200px;overflow:auto;border:1px solid var(--s1);border-radius:12px;margin-top:14px}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--s2);border:1px solid var(--s1);font-size:13.5px;color:var(--soft);margin-bottom:16px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--s3);border-radius:12px;margin-bottom:10px;cursor:pointer;font-weight:500}.opt:has(input:checked){border-color:var(--navy);background:var(--s2)}.opt input{accent-color:var(--navy);width:18px;height:18px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:99px;font-weight:600;font-size:14.5px;display:flex;gap:10px;align-items:center;z-index:30;box-shadow:0 14px 30px -10px #001f34;max-width:92vw}
.foot{background:var(--navy);color:var(--slate);text-align:center;font-size:13.5px;padding:14px 20px;letter-spacing:.02em}.foot b{color:#fff;font-weight:700}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media(max-width:680px){.grid{grid-template-columns:1fr}.pc{min-height:0}.who span,.brand small,.hdr .btn span{display:none}.hdr .btn{width:40px;padding:0}.in{padding-top:28px}.pf{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* reference layer: faculty-portal look */
:root{--bg:#F9FAFC;--bd:#E1E7ED;--tx2:#46627a;--sh:0 1px 2px rgba(0,44,73,.04),0 4px 14px rgba(0,44,73,.05)}
body{background:var(--bg);font-size:14px;line-height:1.45}
.hdr{background:#fff;color:var(--navy);border-bottom:1px solid var(--bd);box-shadow:0 1px 3px rgba(0,44,73,.05);position:sticky;top:0;z-index:10}
.hw{min-height:72px;padding:0 24px;gap:28px}.brand img{height:62px;width:auto;display:block}
.links{display:flex;gap:2px;height:72px;overflow-x:auto}.links button{display:flex;align-items:center;gap:8px;padding:0 14px;border:0;border-bottom:3px solid transparent;background:none;color:var(--navy);font-weight:500;white-space:nowrap;transition:background .2s,border-color .2s}
.links button:hover{background:rgba(214,222,228,.5)}.links button[aria-current=page]{background:var(--slate);border-bottom-color:var(--navy);font-weight:600}
.who{background:none;border:0;padding:0;text-align:right;line-height:1.25;gap:16px;font-weight:400}.who b{display:block}.who small{display:block;color:var(--tx2);font-size:12px}
.hdr .btn.ghost{color:var(--navy);border-color:#C9D4DD}.hdr .btn.ghost:hover{background:#F1F5F8;color:var(--navy)}
.btn{border-radius:6px;height:auto;padding:9px 16px;font-size:14px;box-shadow:none}.btn:hover{transform:none;box-shadow:0 4px 12px rgba(0,44,73,.25)}.btn.ghost{border-color:#C9D4DD}.btn.ghost:hover{box-shadow:none}.btn.sm{padding:5px 10px;font-size:13px;height:auto}
.dm{padding:28px 32px 40px;max-width:1440px;margin:0 auto;width:100%}.dm h1{font:700 24px/1.2 var(--body);letter-spacing:-.01em;margin:0 0 4px}.dm .sub{margin:0 0 20px}
.crumb{font-size:12.5px;color:var(--tx2)}.crumb a{cursor:pointer}.crumb a:hover{color:var(--navy);text-decoration:underline}.crumb b{color:var(--navy)}.ctx{margin-bottom:10px}
.stat,.panel,.bc,.fc{border-radius:10px;border:1px solid var(--bd);box-shadow:var(--sh);padding:18px}
.stat,.bc,.fc{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.stat:hover,.bc:hover,.fc:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,44,73,.12);border-color:rgba(0,44,73,.4)}.panel:hover{transform:none;box-shadow:var(--sh);border-color:var(--bd)}
.stat{background:var(--navy);border-color:var(--navy);box-shadow:0 4px 14px rgba(0,44,73,.18)}.stat:hover{border-color:var(--navy)}.stat .l,.stat .s{color:var(--slate);font-size:12.5px}.stat .n{color:#fff;font:700 26px/1.1 var(--body);margin:4px 0}
.two{grid-template-columns:2fr 1fr}.panel h3{font:600 15px var(--body)}.qa{display:grid;gap:10px}.qa .btn{width:100%}
.bc{border-top:4px solid var(--navy)}.bc h3{font:600 18px var(--body)}.bc.add{border:2px dashed var(--s3)}
th{background:#F3F6F9;color:var(--navy);font-size:12.5px;padding:11px 14px;border-bottom:1px solid var(--bd)}td{padding:12px 14px;border-bottom:1px solid var(--bd)}tbody tr:hover{background:#F3F6F9}
.f input,.f select,.cr select{border-radius:6px;height:40px;border:1px solid #D3DCE4;padding:0 10px}.cr select{height:36px}.md{border-radius:12px;padding:22px}.md h3{font:700 20px var(--body)}
.badge{height:auto;padding:2px 9px;font-size:12px}.toast{border-radius:6px}
.foot{background:#fff;color:var(--tx2);border-top:1px solid var(--bd);padding:14px 20px}.foot b{color:var(--navy)}
@media(max-width:900px){.hw{flex-wrap:wrap;padding:8px 16px;gap:8px}.links{order:3;width:100%;height:44px}.dm{padding:16px}.two{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}

/* dashboard v4 */
.btn:not(.ghost):not(.danger){background:#0A2540;border-color:#0A2540}.btn:not(.ghost):not(.danger):hover{background:#154d73}
.links{overflow:visible}.stats{grid-template-columns:repeat(3,1fr);margin-bottom:24px}.stat{padding:14px 18px}.stat .n{font-size:24px}
.h2{font:700 18px var(--body);margin:0}.head{margin-bottom:16px}
.bg2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.bc2{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;text-align:left;background:#fff;border:2px solid var(--bd);border-radius:12px;padding:26px 24px;min-height:130px;cursor:pointer;box-shadow:var(--sh);transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.bc2:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,44,73,.12);border-color:var(--s3)}.bc2.sel,.bc2.sel:hover{border-color:var(--navy)}
.yr2{font:800 30px/1.1 var(--disp);color:var(--navy);letter-spacing:-.02em}.st2{color:var(--tx2);font-size:14px}
.qa .btn{justify-content:center}
@media(max-width:900px){.links{overflow-x:auto;scrollbar-width:none}.links::-webkit-scrollbar{display:none}.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:680px){.bg2,.stats{grid-template-columns:1fr}.yr2{font-size:26px}}

/* dashboard v5 */
.bk{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:13.5px;color:var(--navy);text-decoration:none;padding:4px 8px 4px 2px;border-radius:6px}.bk:hover{background:var(--slate)}.bk .i{width:18px;height:18px}
.ctx{margin-bottom:6px}.bg2{gap:24px}
.bc2{padding:36px 32px;min-height:190px;gap:10px;border-radius:14px}.yr2{font-size:38px}.st2{font-size:15.5px}
@media(max-width:680px){.bc2{padding:26px 22px;min-height:140px}.yr2{font-size:28px}}

/* dashboard v6 */
.dm h1.big{font:800 32px/1.15 var(--disp);letter-spacing:-.02em;margin:0 0 18px}
.bg2{gap:20px}
.bc2{align-items:stretch;justify-content:flex-start;gap:16px;padding:20px 22px 22px;min-height:0;border-radius:14px}
.bc2:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,44,73,.10)}
.yr2{font-size:24px;text-align:left}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.sx{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:#0A2540;color:#fff;border-radius:10px;padding:14px 16px;text-align:left}
.sx b{font:800 28px/1.1 var(--disp);color:#fff}.sx small{font-size:12.5px;font-weight:500;color:#fff;opacity:.9}

/* admin batches v7 : polished programme header, KPI cards, batch cards */
.ctx{margin-bottom:12px}
.ph{display:flex;align-items:center;gap:18px;padding:20px 24px;margin-bottom:24px;border-radius:14px;border:1px solid #C5D0D9;background-color:#D6DEE4;background-image:linear-gradient(rgba(255,255,255,.3) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.3) 1px,transparent 1px);background-size:32px 32px}
