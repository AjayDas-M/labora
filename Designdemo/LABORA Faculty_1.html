<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>LABORA Faculty</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#002C49;--bg:#F9FAFC;--card:#fff;--bd:#DAE2E9;--sh:0 1px 2px rgba(0,44,73,.04),0 4px 14px rgba(0,44,73,.05);--tx:#002C49;--tx2:#46627a;--tint:#D6DEE4;--ok:#198754;--wn:#D99A27;--er:#C94C4C;--code:#0f2233;box-sizing:border-box}

*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.45 Inter,system-ui,sans-serif;background:#EDF1F5;color:var(--tx)}
#app{display:flex;flex-direction:column;min-height:100vh;background:linear-gradient(180deg,#E6ECF1 0%,#EDF1F5 45%,#F3F6F9 100%)}








main{flex:1 0 auto;width:100%;padding:28px 32px;max-width:1440px;margin:0 auto}
h1{font-size:24px;letter-spacing:-.01em;margin:0 0 4px;color:var(--tx)}h2{font-size:15px;margin:0 0 12px}.sub{color:var(--tx2);margin:0 0 20px}
.crumb{font-size:12.5px;color:var(--tx2);margin-bottom:10px}.crumb a{color:var(--tx2);cursor:pointer}.crumb a:hover{color:var(--navy);text-decoration:underline}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px;box-shadow:var(--sh)}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:2fr 1fr}
.stat b{display:block;font-size:26px;font-weight:700;line-height:1.1}.stat span{color:var(--tx2);font-size:12.5px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid #D3DCE4;border-radius:6px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
.btn{font:inherit;font-weight:600;padding:8px 14px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;width:auto}
.btn{transition:background .25s,box-shadow .25s}.btn:not(.p):not(.ok):not(.wn){border-color:#C9D4DD}.btn:not(.p):not(.ok):not(.wn):hover{background:#F1F5F8}.btn.p,.btn.ok,.btn.wn{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.p:hover,.btn.ok:hover,.btn.wn:hover{background:#00436e}.btn.s{padding:5px 10px;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{margin-left:auto}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12.5px;color:var(--tx2);font-weight:600;padding:11px 14px;color:var(--navy);background:#F3F6F9;border-bottom:1px solid var(--bd)}
td{padding:12px 14px;border-bottom:1px solid var(--bd)}tr:last-child td{border-bottom:0}tbody tr:hover{background:#F3F6F9}
.tw{overflow-x:auto;padding:0}
.bdg{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--tint);color:var(--navy)}
.Approved,.Published{background:#d9f0e3;color:#116038}.Submitted{background:#dbe8f7;color:#174a8b}.Correction{background:#fbecc8;color:#7a5309}.Draft{background:#fbecc8;color:#7a5309}.Progress{background:#e5e9ed;color:#41525f}.Not{background:#eef0f2;color:#6b7782}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:14px}.tabs button{font:inherit;background:none;border:0;padding:8px 12px;color:var(--tx2);cursor:pointer;border-bottom:2px solid transparent;font-weight:500}.tabs button.on{color:var(--navy);border-color:var(--navy);font-weight:600}
label{display:block;font-weight:600;font-size:13px;margin-bottom:4px}.hint{font-size:12px;color:var(--tx2);margin-top:3px;font-weight:400}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.f2 .full{grid-column:1/-1}
.code{background:var(--code);color:#d7e3ec;border-radius:6px;padding:12px 0;font:13px/1.6 ui-monospace,Menlo,monospace;overflow:auto;white-space:pre}
.code div{padding:0 14px}.code span.n{color:#5b7488;display:inline-block;width:28px;user-select:none}.k{color:#e3a35c}.t{color:#7ec0e8}.s2{color:#9fd49a}.c{color:#7a93a6}
.tl{display:flex;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px dashed var(--bd)}.tl time{color:var(--tx2);width:62px;flex:none;font-size:12px}
.pill{font-size:11.5px;padding:1px 7px;border-radius:99px}.pill.n{background:#fbecc8;color:#7a5309}.pill.sb{background:#d9f0e3;color:#116038}.pill.w{background:#f6d9d9;color:#8c2d2d}
details{border:1px solid var(--bd);border-radius:6px;margin-bottom:8px}summary{padding:8px 10px;cursor:pointer;font-weight:600;font-size:13px}details>div{padding:0 10px 10px}
.io{background:var(--bg);border-radius:4px;padding:8px;font:12.5px ui-monospace,monospace;white-space:pre-wrap;margin-top:6px}.io.o{background:var(--code);color:#d7e3ec}
.bar{height:8px;border-radius:99px;background:var(--tint);overflow:hidden;display:flex}.bar i{display:block;height:100%}
.ov{position:fixed;inset:0;background:rgba(0,20,35,.55);display:grid;place-items:center;z-index:20;padding:16px}.md{background:var(--card);box-shadow:0 20px 50px rgba(0,20,35,.25);border-radius:12px;padding:22px;width:460px;max-width:100%}
.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:6px;z-index:30}
.chk{display:flex;gap:8px;align-items:center;font-weight:500}.chk input{width:auto}

.empty{text-align:center;padding:32px;color:var(--tx2)}.card.stat{border-left:3px solid var(--navy)}.sc{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease,background .25s ease}@media(hover:hover){.sc:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,44,73,.12);border-color:rgba(0,44,73,.4);background:#FCFDFE}.sc:hover .btn.p{background:#00436e;box-shadow:0 4px 12px rgba(0,44,73,.3)}}tr.sel{background:#EEF3F7}@media(prefers-reduced-motion:reduce){.sc,.btn,.sc:hover{transform:none}}

nav.top{position:sticky;top:12px;z-index:10;display:flex;align-items:center;gap:24px;margin:12px auto 0;width:calc(100% - 32px);max-width:1360px;padding:0 14px 0 20px;height:68px;background:#fff;border:1px solid rgba(0,44,73,.06);border-radius:999px;box-shadow:0 8px 28px rgba(0,44,73,.12)}
.links{display:flex;gap:4px;align-items:center}.links a{display:flex;align-items:center;height:42px;padding:0 16px;border-radius:999px;color:var(--navy);text-decoration:none;font-weight:500;transition:background .25s,color .25s}
.links a:hover{background:rgba(214,222,228,.6)}.links a.on{background:var(--navy);color:#fff;font-weight:600}
.who{margin-left:auto;display:flex;align-items:center;gap:16px;text-align:right;line-height:1.25}.who small{display:block;color:var(--tx2);font-size:12px}

.btn.p.rv{background:#002C49;color:#fff;border-color:transparent;transition:background .25s ease,box-shadow .25s ease}.btn.p.rv:hover{background:#0F4A73}
.brandlink{display:flex;align-items:center;flex:none}.brand{display:block;width:auto;max-width:100%;object-fit:contain}

.grid>*,.card{min-width:0}input,select,textarea{max-width:100%;min-width:0}.tabs{overflow-x:auto}.tabs button{white-space:nowrap}
.burger,.mm{display:none}.rvtabs{display:none}.actbar{margin-top:16px}.g2e{grid-template-columns:1fr 1fr}
.rv3{grid-template-columns:minmax(220px,260px) minmax(0,1fr) minmax(240px,300px);align-items:start}
h1{font-size:clamp(20px,3.2vw,24px)}
@media(max-width:1023px){.g4{grid-template-columns:repeat(2,1fr)}.g6{grid-template-columns:repeat(3,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.g2,.g2e{grid-template-columns:minmax(0,1fr)}main{padding:24px}nav.top{gap:12px;padding:0 16px}.links a{padding:0 10px;font-size:13.5px}.who small{display:none}.who{gap:10px}nav.top .brand{height:52px!important}.rv3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.rv3>[data-p=code]{grid-column:1/-1;order:-1}}
@media(max-width:767px){
nav.top{height:60px;padding:0 12px}.links,.who{display:none}nav.top .brand{height:44px!important}
.burger{display:flex;margin-left:auto;align-items:center;justify-content:center;width:44px;height:44px;background:#fff;border:1px solid var(--bd);border-radius:8px;color:var(--navy);cursor:pointer}
.mm{display:block;position:absolute;top:100%;left:0;right:0;background:#fff;border-bottom:1px solid var(--bd);box-shadow:0 12px 24px rgba(0,44,73,.12);max-height:calc(100vh - 60px);overflow-y:auto}
.mm a{display:flex;align-items:center;min-height:48px;padding:0 16px;color:var(--navy);text-decoration:none;font-weight:500;border-bottom:1px solid var(--bd)}.mm a.on{background:var(--tint);font-weight:600;box-shadow:inset 3px 0 0 var(--navy)}
.mp{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}.mp small{display:block;color:var(--tx2);font-size:12px}
main{padding:16px 14px}.g4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}.g6{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}.g3,.f2,.g2,.g2e{grid-template-columns:minmax(0,1fr)}
.card{padding:14px}.card.stat b{font-size:22px}
.btn,input:not([type=checkbox]),select{min-height:44px}.btn.s{padding:8px 14px}input,select,textarea{font-size:16px}.tabs button{min-height:44px}.chk input{width:20px;height:20px}
.row>select,.row>input{width:100%!important;max-width:none!important}.sp{margin-left:0}.fa .btn{flex:1 1 100%}
.tw table,.tw thead,.tw tbody,.tw tr,.tw td{display:block}.tw thead{display:none}.tw tr{padding:10px 14px;border-bottom:1px solid var(--bd)}.tw tr:last-child{border:0}
.tw td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;border:0;text-align:right!important;width:auto!important}
.tw td::before{content:attr(data-label);color:var(--tx2);font-size:12px;font-weight:600;text-align:left;flex:none}.tw td[data-label=""]{justify-content:flex-end;flex-wrap:wrap}.tw td[data-label=""]::before{display:none}.tw td .bar{flex:1;max-width:55%}
.rvtabs{display:flex;border-bottom:1px solid var(--bd);margin-bottom:12px}.rvtabs button{flex:1;min-height:44px;font:inherit;font-weight:500;background:none;border:0;border-bottom:2px solid transparent;color:var(--tx2);cursor:pointer}.rvtabs button.on{color:var(--navy);border-color:var(--navy);font-weight:600}
.rv3{grid-template-columns:minmax(0,1fr)}.rv3>[data-p]{display:none}.rv3[data-tab=code]>[data-p=code],.rv3[data-tab=act]>[data-p=act],.rv3[data-tab=exe]>[data-p=exe]{display:block;grid-column:auto;order:0}
.actbar{position:sticky;bottom:8px;z-index:5;box-shadow:0 8px 24px rgba(0,44,73,.2)}.actbar{padding:10px;gap:8px}.actbar>span{display:none}.actbar>.btn,.actbar .sp{flex:1 1 100%}.actbar>.btn{order:2;min-height:36px;padding:6px 12px}.actbar .sp{display:flex;gap:8px;order:1}.actbar .sp .btn{flex:1;padding:8px 8px;font-size:13.5px}
.toast{left:12px;right:12px;bottom:12px;text-align:center}}

.ni{width:18px;height:18px;margin-right:8px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.av{width:36px;height:36px;border-radius:50%;background:var(--tint);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}.who .btn{border-radius:999px;padding:7px 14px}
.ft{flex:none;margin-top:24px;padding:18px 16px 20px;text-align:center;color:var(--navy);font-size:13px;font-weight:500;border-top:1px solid #D3DCE4;background:rgba(255,255,255,.55)}
.card.stat.dark{display:flex;align-items:center;gap:16px;position:relative;overflow:hidden;border:0;border-radius:14px;background:linear-gradient(135deg,#001F35 0%,#002C49 52%,#0E476E 100%);background-size:180% 180%;background-position:0 0;box-shadow:0 10px 24px rgba(0,44,73,.22);transition:background-position .3s ease,box-shadow .3s ease,transform .3s ease}
.card.stat.dark::before,.card.stat.dark::after{content:"";position:absolute;top:50%;border-radius:50%;border:1px solid rgba(214,222,228,.16);pointer-events:none}
.card.stat.dark::before{width:170px;height:170px;margin-top:-85px;right:-48px}.card.stat.dark::after{width:92px;height:92px;margin-top:-46px;right:-9px}
.card.stat.dark>*{position:relative;z-index:1}
.card.stat.dark .ic{flex:none;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(214,222,228,.25);color:#fff}.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card.stat.dark span,.card.stat.dark small{display:block}.card.stat.dark span{color:#D6DEE4;font-weight:600;font-size:13.5px}.card.stat.dark small{color:#D6DEE4;opacity:.85;font-size:12.5px;margin-top:2px}.card.stat.dark b{color:#fff;font-size:30px;margin:2px 0}
@media(hover:hover){.card.stat.dark:hover{background-position:100% 100%;box-shadow:0 16px 32px rgba(0,44,73,.3);transform:translateY(-2px)}}
@media(prefers-reduced-motion:reduce){.card.stat.dark{transition:none}.card.stat.dark:hover{transform:none}}
@media(max-width:1023px){.links .ni{display:none}}
@media(max-width:767px){nav.top{width:calc(100% - 20px);margin-top:10px;top:10px;padding:0 8px 0 14px}.mm{top:calc(100% + 8px);border:1px solid var(--bd);border-radius:20px;padding:8px;max-height:calc(100vh - 100px)}.mm a{border:0;border-radius:12px;margin-bottom:2px}.mm a.on{background:var(--navy);color:#fff;box-shadow:none}.card.stat.dark{flex-direction:column;align-items:flex-start;gap:10px}.card.stat.dark .ic{width:40px;height:40px}.card.stat.dark b{font-size:26px}}

if(m=='appr')return w(`<h2>Approve this submission?</h2><p class="sub">The experiment will be added to the student's lab record.</p><div class="row" style="justify-content:flex-end">${x}<button class="btn ok" onclick="S.modal=null;S.rev.st='Approved';toast('Submission approved');nav('#/records')">Approve</button></div>`);
if(m=='corr')return w(`<h2>Request correction</h2><label>Reason</label><select><option>Output does not match expected</option><option>Missing edge cases</option><option>Code quality</option><option>Suspicious activity</option></select><br><br><label>Feedback to student</label><textarea rows=4 id="fb" placeholder="Explain what to fix"></textarea><br><div class="row" style="justify-content:flex-end">${x}<button class="btn wn" onclick="if(!$('#fb').value.trim()){$('#fb').style.borderColor='var(--er)';return}S.modal=null;S.rev.st='Correction';toast('Correction requested');${back}">Send request</button></div>`);
if(m=='publish')return w(`<h2>Publish this practical?</h2><p class="sub">Students enrolled in the subject will see it immediately.</p><div class="row" style="justify-content:flex-end">${x}<button class="btn p" onclick="S.modal=null;toast('Practical published');nav('#/subs/${h[2]}/${h[3]=='new'?PR[h[2]].length:h[3]}')">Publish</button></div>`);
return w(`<h2>Student preview</h2><p class="sub">Sum of N Numbers · Restricted · Secure Browser required</p><div class="code"><div>Starter code appears here</div></div><br><div class="row" style="justify-content:flex-end">${x}</div>`)}
const IC={Dashboard:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>','My Subjects':'<path d="M2 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2zM22 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"/>',Submissions:'<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/>','Lab Records':'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 14l2 2 4-4"/>',Reports:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',check:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>'};
const ico=n=>IC[n]?`<svg class="ni" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`:'';
const FOOTER='<footer class="ft">Powered by RLabz</footer>';
function labelTables(){if(!document.querySelectorAll)return;document.querySelectorAll('.tw table').forEach(t=>{const h=[...t.querySelectorAll('thead th')].map(x=>x.textContent.trim());t.querySelectorAll('tbody tr').forEach(r=>[...r.children].forEach((c,i)=>c.setAttribute('data-label',h[i]||'')))})}
function draw(focus){const h=(location.hash||'#/dashboard').split('/'),r=h[1];let v;
try{v=r=='dashboard'?dashboard():r=='subjects'?subjects():r=='practicals'?practicals(h[2]):r=='edit'?edit(h[2],h[3]):r=='subs'?subs(h[2],h[3]):r=='review'?review(h[2],h[3],+h[4]):r=='records'?records():r=='reports'?reports():dashboard()}catch(e){v=dashboard()}
if(S.out)v=`<div style="min-height:100vh;display:grid;place-items:center;padding:16px"><div class="card" style="max-width:400px;text-align:center"><div style="display:flex;justify-content:center;margin-bottom:12px">${logo(96)}</div><h2>You have been logged out</h2><p class="sub">Sign in again from the Admin Module.</p><button class="btn p" onclick="S.out=false;draw()">Return to faculty workspace</button></div></div>`;$('#root').innerHTML=v+modalHtml()+(S.toast?`<div class="toast" role="status">${S.toast}</div>`:'');
labelTables();
if(focus){const i=$('#'+focus);if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}}
addEventListener('hashchange',()=>{S.q='';S.sq='';S.sf='All';S.tab='Details';S.modal=null;S.ai=false;S.menu=false;S.rvTab='code';draw();scrollTo(0,0)});draw();
