<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:calc(max(10px,env(safe-area-inset-top,0px)) + 80px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>LABORA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one shared white top bar for every student page; editor route replaces the whole shell with its own full-height workspace. Navy + slate + white only. */
:root{
  --navy:#002c49; --navy-2:#0a3d5f; --navy-3:#154d73; --navy-deep:#001f34;
  --slate:#D6DEE4; --slate-1:#e8edf1; --slate-2:#f3f6f8; --slate-3:#b9c6cf;
  --ink-soft:#4a6479; --white:#fff;
  --display:'Manrope','Segoe UI',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.4,0,.2,1);
  --nav-top:max(10px,env(safe-area-inset-top,0px));
  --nav-h:70px;
  --nav-clearance:28px;
  --page-top-space:calc(var(--nav-top) + var(--nav-h) + var(--nav-clearance));
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
#root{display:flow-root}
#root:has(>.bar)::before{content:"";position:fixed;top:0;left:0;right:0;height:var(--nav-top);background:var(--slate-2);z-index:19;pointer-events:none}
body{margin:0;background:var(--slate-2);color:var(--navy);font:400 15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
svg{display:block}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* shared top bar (light capsule style) */
.bar{border-radius:9999px;position:fixed;top:var(--nav-top);left:0;right:0;width:calc(100% - 24px);max-width:1320px;margin:0 auto;z-index:20;background:var(--white);border:1px solid var(--slate-3);box-shadow:0 8px 24px -8px #002c492b,0 2px 6px -2px #002c4914}
.bar .wrap{display:flex;align-items:center;gap:18px;min-height:64px;max-width:none;margin:0;padding:6px 14px 6px 10px}
.logo{display:grid;place-items:center;flex:none;width:48px;height:48px;border-radius:50%;background:var(--white);border:1.5px solid var(--slate-3);overflow:hidden;box-shadow:0 2px 8px -4px #002c4940}
.logo img{display:block;width:90%;height:auto;max-height:90%;object-fit:contain}
.nav{display:flex;align-items:center;gap:6px;margin-left:4px}
.nav a{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:9999px;font:600 14px var(--display);color:var(--navy);transition:all .2s var(--ease)}
.nav a .i{width:17px;height:17px}
.nav a:hover{background:var(--slate-2);color:var(--navy)}
.nav a[aria-current="page"]{background:var(--navy);color:var(--white);font-weight:700;box-shadow:0 4px 12px -4px #002c4966}
.sp{flex:1}
.me{display:flex;align-items:center;gap:10px;text-align:left}
.me .av{display:grid}
.av{width:38px;height:38px;border-radius:50%;background:#dbe4ec;color:var(--navy);display:grid;place-items:center;font:700 13px var(--display);flex:none;border:1.5px solid var(--slate-3)}
.me b{display:block;font:700 13.5px/1.2 var(--display);color:var(--navy)}
.me small{display:block;font-size:11.5px;color:var(--ink-soft);line-height:1.2}
.so{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 18px;border-radius:9999px;border:1.5px solid var(--slate-3);background:var(--white);color:var(--navy);font:600 13.5px var(--display);transition:all .2s var(--ease)}
.so:hover{background:var(--navy);color:var(--white);border-color:var(--navy)}

/* page: light slate ground; only the nav bar and subject cards are navy */
.canvas{position:relative;overflow:hidden;min-height:100vh;min-height:100dvh;background:linear-gradient(180deg,var(--slate-2),var(--slate-1) 55%,var(--slate));color:var(--navy)}
.canvas::before{content:"";position:absolute;inset:0;background-image:linear-gradient(#002c490a 1px,transparent 1px),linear-gradient(90deg,#002c490a 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 0,#000 10%,transparent 72%);pointer-events:none}
.page{position:relative;padding-top:var(--page-top-space);padding-bottom:72px}
.eyebrow{font:600 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--navy-3)}
.hello{margin-bottom:34px}
.hello h1{font:800 clamp(26px,3.4vw,36px)/1.08 var(--display);letter-spacing:-.025em;color:var(--navy)}

/* My Practicals landing: intro, section header */
.intro{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px;margin-bottom:40px}
.intro .hello{margin:0}
.intro .sub{margin-top:8px;color:var(--ink-soft);font-size:15px;max-width:52ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.stu{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;background:var(--white);border:1.5px solid var(--slate-3);font:600 13px var(--display);color:var(--navy)}
.stu small{font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.sechead{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.sechead h2{font:800 17px var(--display);letter-spacing:-.01em;color:var(--navy);white-space:nowrap}
.sechead .ln{flex:1;height:1px;background:var(--slate-3)}
.sechead span.cnt{font:600 13px var(--body);color:var(--ink-soft);white-space:nowrap}
@media (max-width:560px){.intro{margin-bottom:30px}}
.crumb{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink-soft);margin-bottom:14px}
.crumb a{font-weight:600;color:var(--navy)}
.crumb a:hover{text-decoration:underline}

/* subject cards (white) */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.sc{position:relative;display:flex;flex-direction:column;background:var(--white);border:1.5px solid var(--slate-3);border-radius:20px;padding:24px;min-height:290px;overflow:hidden;isolation:isolate;color:var(--navy);
  box-shadow:0 10px 24px -18px #002c4999;transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .3s var(--ease);-webkit-tap-highlight-color:transparent}
.sc::before{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:var(--slate-2);border:1px solid var(--slate);z-index:-1;transition:transform .5s var(--ease)}
.code{align-self:flex-start;display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:99px;background:var(--navy);color:var(--white);font:700 12.5px var(--mono);letter-spacing:.06em}
.sc h3{font:800 23px/1.2 var(--display);letter-spacing:-.015em;margin-top:22px;text-wrap:balance;color:var(--navy)}
.lab{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-top:20px}
.fac{display:flex;align-items:center;gap:10px;margin-top:6px;font-weight:600;color:var(--navy)}
.fac .av{width:32px;height:32px;font-size:11.5px}
.sc .gap{height:22px}
.vp{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;height:48px;padding:0 6px 0 18px;border-radius:12px;background:var(--navy);border:1.5px solid var(--navy);color:var(--white);font:700 14.5px var(--display);transition:background .3s var(--ease),box-shadow .3s var(--ease)}
.vp i{width:36px;height:36px;border-radius:9px;background:#ffffff1f;color:var(--white);display:grid;place-items:center;transition:transform .3s var(--ease),background .3s var(--ease)}
.vp:disabled{opacity:.45;cursor:not-allowed}
@media (hover:hover){.sc:hover{transform:translateY(-6px) scale(1.02)}}
.sc:hover,.sc:focus-visible,.sc:focus-within{border-color:var(--navy);box-shadow:0 30px 44px -22px #002c49cc,0 0 0 3px #002c4916}
.sc:focus-visible{outline:3px solid var(--navy);outline-offset:4px}
.sc:hover::before,.sc:focus-visible::before{transform:scale(1.15)}
.sc:hover .vp:not(:disabled),.sc:focus-visible .vp:not(:disabled){background:var(--navy-2)}
.sc:hover .vp:not(:disabled) i,.sc:focus-visible .vp:not(:disabled) i{transform:translateX(4px);background:#ffffff33}
.sc:active{transform:scale(.99)}
/* My Practicals cards: original dark navy */
.sc.dark{background:linear-gradient(160deg,#0a3d5f 0%,#002c49 55%,#001f34 100%);border-color:#D6DEE433;color:var(--white);box-shadow:0 1px 0 #D6DEE41f inset,0 18px 34px -20px #000d}
.sc.dark::before{background:radial-gradient(circle,#D6DEE41a,transparent 70%);border:1px solid #D6DEE430}
.sc.dark::after{content:"";position:absolute;right:-20px;top:-20px;width:120px;height:120px;border-radius:50%;border:1px solid #D6DEE426;z-index:-1}
.sc.dark .code{background:var(--slate);color:var(--navy)}
.sc.dark h3,.sc.dark .fac{color:var(--white)}
.sc.dark .lab{color:var(--slate-3)}
.sc.dark .vp{background:#D6DEE41a;border-color:#D6DEE44d;color:var(--white)}
.sc.dark .vp i{background:var(--slate);color:var(--navy)}
.sc.dark:hover,.sc.dark:focus-visible{border-color:var(--slate);box-shadow:0 1px 0 #D6DEE433 inset,0 34px 50px -24px #000f,0 0 0 3px #002c4922}
.sc.dark:hover .vp,.sc.dark:focus-visible .vp{background:var(--slate);color:var(--navy);border-color:var(--slate)}
.sc.dark:hover .vp i,.sc.dark:focus-visible .vp i{background:var(--navy);color:var(--white);transform:translateX(4px)}

.stat{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.stat b{font:800 38px/1 var(--display);letter-spacing:-.02em}
.stat span{color:var(--ink-soft);font-size:13.5px}
.hintline{font-size:12.5px;color:var(--ink-soft);margin:8px 0 0;min-height:19px}
button.vp{width:100%;cursor:pointer;text-align:left}
button.vp:focus-visible{outline:3px solid var(--slate);outline-offset:2px}

/* panels and rows (light) */
.panel{background:var(--white);border:1px solid var(--slate-3);border-radius:18px;box-shadow:0 10px 24px -20px #002c4999;overflow:hidden}
.subhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.subhead h1{font:800 clamp(26px,3.4vw,36px)/1.15 var(--display);letter-spacing:-.02em;color:var(--navy);margin-top:6px}
.subhead p{color:var(--ink-soft);margin-top:4px}
.subhead .eyebrow{margin:0}
.prog{min-width:220px}
.prog small{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-bottom:6px}
.meter{height:8px;border-radius:99px;background:var(--slate);overflow:hidden}
.meter i{display:block;height:100%;background:var(--navy);border-radius:99px;transition:width .4s var(--ease)}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) 140px auto;gap:16px;align-items:center;padding:16px 20px;border-top:1px solid var(--slate)}
.row:first-child{border-top:0}
.n{width:40px;height:40px;border-radius:11px;background:var(--slate-2);border:1px solid var(--slate-3);display:grid;place-items:center;font:800 14px var(--display);color:var(--navy)}
.row b{display:block;font:700 15.5px/1.3 var(--display);color:var(--navy)}
.row small{color:var(--ink-soft);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px;border-radius:99px;font-size:12px;font-weight:600;border:1.5px solid var(--slate-3);color:var(--ink-soft);background:var(--white);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor}
.pill.p1{color:var(--navy-3);border-color:var(--navy-3)}
.pill.p1::before{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.pill.p2{background:var(--navy);color:var(--white);border-color:var(--navy)}
.pill.p2::before{background:currentColor}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1.5px solid var(--navy);background:var(--navy);color:var(--white);font:700 13.5px var(--display);transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .25s var(--ease)}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 18px -10px #002c49dd;background:var(--navy-2)}
.btn.ghost{background:var(--white);color:var(--navy);border-color:var(--slate-3)}
.btn.ghost:hover:not(:disabled){border-color:var(--navy);background:var(--slate-2);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .i{width:16px;height:16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{height:40px;padding:0 16px;border-radius:99px;border:1.5px solid var(--slate-3);background:var(--white);font:600 13.5px var(--display);color:var(--ink-soft);transition:all .25s var(--ease)}
.tab:hover{border-color:var(--navy);color:var(--navy)}
.tab[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--white)}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* practicals page */
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.ph .code{margin-bottom:10px}
.ph h1{font:800 clamp(28px,3.8vw,40px)/1.12 var(--display);letter-spacing:-.025em}
.ph small{display:block;margin-top:6px;color:var(--ink-soft);font-size:14px}
.btn.lg{height:46px;padding:0 20px;font-size:14px}
.lay{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;align-items:start}
.sbar{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.sfield{position:relative;flex:1;min-width:200px}
.sfield svg{position:absolute;left:14px;top:14px;color:var(--ink-soft)}
.sin{width:100%;height:46px;padding:0 14px 0 42px;border-radius:12px;border:1.5px solid var(--slate-3);background:var(--white);font-size:15px;color:var(--navy);transition:border-color .25s var(--ease),box-shadow .25s var(--ease)}
.sin::placeholder{color:#7c92a3}
.sin:focus{outline:0;border-color:var(--navy);box-shadow:0 0 0 4px #002c4920}
.total{font:700 13.5px var(--display);color:var(--navy);background:var(--white);border:1.5px solid var(--slate-3);border-radius:99px;height:38px;padding:0 14px;display:inline-flex;align-items:center;white-space:nowrap}
.plist{display:grid;gap:14px}
.pc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;background:var(--white);border:1.5px solid var(--slate-3);border-radius:16px;padding:18px 20px;box-shadow:0 8px 20px -18px #002c4999;transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .3s var(--ease)}
.pc:hover{transform:translateY(-3px);border-color:var(--navy);box-shadow:0 20px 30px -20px #002c49cc}
.qn{min-width:52px;height:44px;padding:0 10px;border-radius:12px;background:var(--navy);color:var(--white);display:grid;place-items:center;font:800 15px var(--display);letter-spacing:.02em}
.pc h3{font:700 17px/1.3 var(--display);color:var(--navy)}
.pc p{color:var(--ink-soft);font-size:14px;margin-top:3px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:600;border:1.5px solid var(--slate-3);color:var(--ink-soft);background:var(--slate-2)}
.tag.ok{background:var(--navy);border-color:var(--navy);color:var(--white)}
.act{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;font:700 14px var(--display);white-space:nowrap;transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .25s var(--ease),color .25s var(--ease)}
.act.solve{background:var(--navy);color:var(--white);border:1.5px solid var(--navy)}
.act.solve:hover{transform:translateY(-2px);background:var(--navy-2);box-shadow:0 12px 20px -12px #002c49}
.act.solve .i{transition:transform .25s var(--ease)}
.act.solve:hover .i{transform:translateX(4px)}
.act.solved{background:var(--slate);color:var(--navy);border:1.5px solid var(--slate-3)}
.act.solved:hover{background:var(--slate-1);border-color:var(--navy)}
.none{text-align:center;padding:40px 20px;background:var(--white);border:1.5px dashed var(--slate-3);border-radius:16px;color:var(--ink-soft)}
.none b{display:block;color:var(--navy);font:700 16px var(--display);margin-bottom:4px}
.fp{position:sticky;top:96px;background:var(--white);color:var(--navy);border:1.5px solid var(--slate-3);border-radius:18px;padding:20px;box-shadow:0 10px 24px -18px #002c4999}
.fp h2{font:800 17px var(--display)}
.fp h4{margin:20px 0 8px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
.fp label{display:flex;align-items:center;gap:11px;padding:9px 6px;border-radius:9px;cursor:pointer;font-size:14.5px;transition:background .2s var(--ease)}
.fp label:hover{background:var(--slate-2)}
.fp input{position:absolute;opacity:0;width:1px;height:1px}
.fp .bx{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--slate-3);background:var(--white);display:grid;place-items:center;color:transparent;flex:none;transition:all .2s var(--ease)}
.fp .bx svg{width:12px;height:12px;stroke-width:3.2}
.fp input:checked+.bx{background:var(--navy);border-color:var(--navy);color:var(--white)}
.fp input:focus-visible+.bx{outline:3px solid var(--navy);outline-offset:2px}
.fp label span:last-child{margin-left:auto;font-size:12.5px;color:var(--ink-soft)}
.fp .clr{margin-top:18px;width:100%;height:42px;border-radius:10px;border:1.5px solid var(--slate-3);background:var(--white);color:var(--navy);font:700 13.5px var(--display);transition:all .25s var(--ease)}
.fp .clr:hover:not(:disabled){background:var(--navy);color:var(--white);border-color:var(--navy)}
.fp .clr:disabled{opacity:.45;cursor:not-allowed}
@media (max-width:980px){
  .lay{grid-template-columns:1fr}
  .fp{position:static;order:2}
}
@media (max-width:620px){
  .pc{grid-template-columns:auto minmax(0,1fr);padding:16px}
  .pc .act{grid-column:1/-1;width:100%}
  .ph .btn.lg{width:100%}
}

/* download dialog */
.ov{position:fixed;inset:0;z-index:60;background:#001f3499;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));animation:fade .2s var(--ease);overflow:auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.md{width:100%;max-width:1020px;background:var(--white);color:var(--navy);border-radius:22px;box-shadow:0 40px 80px -30px #001f34;border:1px solid var(--slate-3);animation:rise .28s var(--ease);margin:auto;display:flex;flex-direction:column;max-height:min(92vh,780px);overflow:hidden}
.md.sm{max-width:520px}
.md:focus{outline:0}
.mh{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:20px 28px;border-bottom:1px solid var(--slate)}
.mh h2{font:800 21px/1.2 var(--display);letter-spacing:-.015em}
.x{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--slate-3);background:var(--white);color:var(--navy);display:grid;place-items:center;flex:none;transition:all .2s var(--ease)}
.x:hover{background:var(--slate-2);border-color:var(--navy)}
.pbody{display:grid;grid-template-columns:minmax(300px,370px) minmax(0,1fr);min-height:0;flex:1}
.pset{overflow:auto;padding:8px 28px 12px;border-right:1px solid var(--slate)}
.ps{padding:18px 0;border-bottom:1px solid var(--slate)}
.ps:last-child{border-bottom:0}
.ps h3{font:700 15px var(--display);margin:0 0 4px}

function parseSpec(text,what,check){

    if(!m)return {err:'"'+tk+'" is not valid. Use numbers like 1-3 or 2,4,6-8.'};
    var a=+m[1],b=m[2]?+m[2]:a;
    if(b<a)return {err:'The range '+tk+' runs backwards. Write it as '+b+'-'+a+'.'};
    if(a<1)return {err:'Numbers start from 1.'};
    if(b-a>999)return {err:'That range is too large.'};
    for(var n=a;n<=b;n++){var e=check(n);if(e)return {err:e};seen[n]=1}

  var s=subj(code),e=s&&s.ex[n-1];if(!e)return null;

  return '<div class="ed"><div class="edtop"><a class="back" href="#subject/'+code+'">'+BACK+'Practicals</a><div><h1>Exp '+n+' · '+esc(e.t)+'</h1><small>'+code+' · '+esc(s.name)+'</small></div><span class="sp"></span>'+
  '<button class="btn ghost" id="rst">Reset</button><button class="btn" id="run"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg>Run</button></div>'+
  '<div class="edbody"><aside class="brief"><div><h4>Aim</h4><p>'+esc(e.aim)+'</p></div><div><h4>Expected output</h4><pre>'+esc(e.out.join('\n'))+'</pre></div><div><h4>Tip</h4><ul><li>Remove the TODO lines once you finish.</li><li>Run to check your output.</li></ul></div></aside>'+
  '<div class="work"><div class="code-area"><div class="tabbar"><span>'+(s.lang==='C'?'main.c':'main.py')+'</span><em>'+s.lang+' · Demo runner</em></div><textarea id="code" spellcheck="false" aria-label="Code editor">'+esc(p.code)+'</textarea></div>'+
  '<div class="outp"><div class="outh">Output<span class="st" id="st"></span></div><div class="outb" id="outb"><p class="empty">Press Run to see your program’s output here.</p></div></div></div></div></div>';
}
function bindEditor(code,n){
  var s=subj(code),e=s.ex[n-1],k=code+'-'+n,p=PROG[k],ta=$('#code');
  ta.addEventListener('input',function(){p.code=ta.value;if(p.state===0&&p.code!==e.start)p.state=1});
  ta.addEventListener('keydown',function(ev){
    if(ev.key==='Tab'){ev.preventDefault();ta.setRangeText('    ',ta.selectionStart,ta.selectionEnd,'end');p.code=ta.value}
    if((ev.ctrlKey||ev.metaKey)&&ev.key==='Enter'){ev.preventDefault();run()}});
  $('#rst').onclick=function(){ta.value=e.start;p.code=e.start;p.state=0;$('#outb').innerHTML='<p class="empty">Press Run to see your program’s output here.</p>';$('#st').textContent='';toast('Starter code restored')};
  $('#run').onclick=run;
  function run(){
    var b=$('#run');b.disabled=true;p.code=ta.value;
    $('#st').innerHTML='<span class="spin"></span> Running';
    clearTimeout(runTimer);
    runTimer=setTimeout(function(){
      b.disabled=false;var t=p.code,bad=(t.split('{').length!==t.split('}').length)||(s.lang==='C'&&/printf\s*\(/.test(t)&&!/stdio\.h/.test(t));
      if(bad){$('#outb').innerHTML='<pre>Build failed. Check your brackets and #include lines.</pre>';$('#st').textContent='Failed';return}
      if(/TODO/.test(t)){$('#outb').innerHTML='<pre>The program is unfinished. Remove the TODO lines after you write the code.</pre>';$('#st').textContent='Incomplete';if(p.state===0)p.state=1;return}
      $('#outb').innerHTML='<pre>'+esc(e.out.join('\n'))+'</pre>';$('#st').textContent='Finished · exit code 0';p.state=2;toast('Practical completed. It is now in your lab record.');
    },750);
  }
}

function render(){
  var r=$('#root');clearTimeout(runTimer);
  if(!authed){r.innerHTML=LOGIN;bindLogin();window.scrollTo(0,0);return}
  var rt=route(),h;
  if(rt.v==='editor'){h=vEditor(rt.a,+rt.b);if(h){r.innerHTML=h;bindEditor(rt.a,+rt.b);window.scrollTo(0,0);return}location.hash='#dashboard';return}
  if(rt.v==='subject')r.innerHTML=shell('dashboard',vSubject(rt.a));
  else if(rt.v==='record')r.innerHTML=shell('record',vRecord());
  else r.innerHTML=shell('dashboard',vDash());
  var so=$('#so');if(so)so.onclick=function(){authed=false;location.hash='';render()};
  window.scrollTo(0,0);
}
document.addEventListener('input',function(ev){if(MD&&ev.target.dataset&&ev.target.dataset.pf){MD[ev.target.dataset.pf]=ev.target.value;live();return}if(ev.target.id==='sq'){SF.q=ev.target.value;refreshSubject()}});
document.addEventListener('change',function(ev){if(MD&&ev.target.name==='fmt'){MD.fmt=ev.target.value;live();return}
  if(MD&&(ev.target.name==='pmode'||ev.target.name==='gmode')){var pm=ev.target.name==='pmode';MD[pm?'pmode':'gmode']=ev.target.value;live();if(ev.target.value==='custom')$(pm?'#ptext':'#gtext').focus();return}var f=ev.target.dataset&&ev.target.dataset.f;if(!f)return;var p=f.split('.');SF[p[0]][p[1]]=ev.target.checked;refreshSubject()});
document.addEventListener('click',function(ev){
  if(ev.target.closest('#clr')){SF.ap.y=SF.ap.n=SF.co.s=SF.co.u=false;refreshSubject();return}
  var d=ev.target.closest('[data-open]');
  if(d){var cd=d.dataset.open;if(approvedList(subj(cd)).length)openModal(cd);else toast('No teacher-approved programs yet for this subject');return}
  if(ev.target.closest('[data-mclose]')||ev.target.id==='ov'){if(MD&&MD.stage!=='busy')closeModal();return}
  if(ev.target.closest('#mgo')){generate();return}
  if(ev.target.closest('[data-msave]')){if(MD&&MD.file)saveFile(MD.file);return}
  var t=ev.target.closest('[data-sub],[data-prev],[data-dl]');if(!t)return;
  if(t.dataset.sub){recSel=t.dataset.sub;render()}
  else if(t.dataset.prev)toast('Opening the record preview for '+t.dataset.prev+' (simulated)');
  else if(t.dataset.dl)toast('PDF generated for '+t.dataset.dl+' (download is simulated in this prototype)');
});
document.addEventListener('keydown',function(ev){
  if(!MD)return;
  if(ev.key==='Escape'&&MD.stage!=='busy'){closeModal();return}
  if(ev.key==='Tab'){var f=Array.prototype.slice.call(document.querySelectorAll('.md button:not(:disabled),.md input:not(:disabled)'));
    if(f.length){var i=f.indexOf(document.activeElement);
      if(ev.shiftKey&&i<=0){ev.preventDefault();f[f.length-1].focus()}
      else if(!ev.shiftKey&&i===f.length-1){ev.preventDefault();f[0].focus()}}}
  if(ev.key==='Enter'&&ev.target.classList&&ev.target.classList.contains('pin')){ev.preventDefault();var b=$('#mgo');if(b&&!b.disabled)generate()}
});
window.addEventListener('hashchange',function(){if(!authed)return;MD=null;drawModal(false);SF={q:'',ap:{y:false,n:false},co:{s:false,u:false}};render()});
if(location.hash)location.hash='';
render();
})();
</script>
